<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storyworld — Adi Parva Ch.01</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="experience">
      <canvas id="world" aria-label="Roamable 3D story world"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <div id="loader" class="visible" role="status">
        <img id="poster" alt="Scene keyframe" />
        <p id="loadmsg">Loading…</p>
      </div>
      <aside id="information" aria-live="polite">
        <p id="kicker">Mahabharata · Adi Parva · a journey</p>
        <h1 id="sceneTitle">Loading…</h1>
        <p id="narration"></p>
        <div id="journey"><div id="journeybar"></div></div>
        <div id="controls">
          <button id="pause" type="button" title="Play / pause (Space)">Pause</button>
          <button id="speedcycle" type="button" title="Journey speed">1×</button>
          <button id="voice" type="button" title="Voice on/off">Voice: on</button>
        </div>
        <p id="progress"></p>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
